# Hämtar evenemang från alla källor varje morgon och sparar dem i repot
# (en fil per källa i data/) och, om det är inställt, i Firestore.
#
# Går också att köra för hand: fliken Actions -> "Hämta evenemang" -> Run workflow.
#
# Varje källa är ett eget steg. Om en källa misslyckas körs de andra ändå,
# och det som lyckades sparas. Körningen blir röd om något gick fel.

name: Hämta evenemang

on:
  schedule:
    # Varje dag 04:13 UTC, alltså 06:13 svensk sommartid och 05:13 vintertid.
    - cron: "13 4 * * *"
  workflow_dispatch:
    inputs:
      bara_bygg:
        description: "Bara bygg om sidan från dagens data, utan att hämta från källorna"
        type: boolean
        default: false

permissions:
  contents: write # behövs för att spara de nya datafilerna i repot
  issues: write # behövs för larmen, som blir ärenden med etiketten "larm"

concurrency:
  group: hamta-evenemang
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Första körningen läser alla evenemangssidor, runt 35 minuter.
    env:
      SVK_API_KEY: ${{ secrets.SVK_API_KEY }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      TICKSTER_API_KEY: ${{ secrets.TICKSTER_API_KEY }}
      BILLETTO_API_KEY: ${{ secrets.BILLETTO_API_KEY }}
      # Bara "true" eller "false", så att token inte når de andra stegen.
      HAR_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      # Mindre modell först. Byt till en större om facit visar för låg träffsäkerhet.
      KLASSA_MODELL: claude-haiku-4-5-20251001
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # Krypterar källornas filer och rådatan, som inte ska ligga öppet (scripts/kalldata.mjs).
      DATA_NYCKEL: ${{ secrets.DATA_NYCKEL }}
      # "false" när någon startar körningen för hand med "Bara bygg om sidan".
      # Då hämtas inget från källorna (högst en hämtning per källa och dygn).
      HAMTA: ${{ github.event.inputs.bara_bygg != 'true' }}
    steps:
      - name: Hämta koden
        uses: actions/checkout@v7

      - name: Installera Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installera paket
        run: npm ci

      - name: Hämta förra körningens källdata (krypterad)
        # Källornas filer ligger inte i repot. Senaste sparade versionen hämtas från GitHubs cache.
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: tmp/kalldata.enc
          key: kalldata-${{ github.run_id }}
          restore-keys: kalldata-

      - name: Packa upp förra körningens källdata
        if: env.DATA_NYCKEL != '' && hashFiles('tmp/kalldata.enc') != ''
        continue-on-error: true
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:DATA_NYCKEL -in tmp/kalldata.enc | tar -xzf -
          echo "Packade upp $(node scripts/kalldata.mjs | wc -l) filer."

      - name: Kör testerna
        run: npm test

      - name: Svenska kyrkan
        id: svk
        # Hoppas över tills hemligheten SVK_API_KEY finns.
        if: env.HAMTA == 'true' && env.SVK_API_KEY != ''
        continue-on-error: true
        run: npm run hamta:svk

      - name: Uppsala stadsteater
        if: env.HAMTA == 'true'
        id: stadsteatern
        continue-on-error: true
        run: npm run hamta:stadsteatern

      - name: Destination Uppsala
        if: env.HAMTA == 'true'
        id: destination
        continue-on-error: true
        run: npm run hamta:destination-uppsala

      - name: Tickster
        if: env.HAMTA == 'true'
        id: tickster
        continue-on-error: true
        run: npm run hamta:tickster

      - name: Bibliotek Uppsala
        if: env.HAMTA == 'true'
        id: bibliotek
        continue-on-error: true
        run: npm run hamta:bibliotek

      - name: Kubik Uppsala
        if: env.HAMTA == 'true'
        id: kubik
        continue-on-error: true
        run: npm run hamta:kubik

      - name: Förbund och ligor (sport)
        if: env.HAMTA == 'true'
        id: sport
        continue-on-error: true
        run: npm run hamta:sport

      - name: Ticketmaster
        id: ticketmaster
        # Hoppas över tills hemligheten TICKETMASTER_API_KEY finns.
        if: env.HAMTA == 'true' && env.TICKETMASTER_API_KEY != ''
        continue-on-error: true
        run: npm run hamta:ticketmaster

      # Arrangörernas egna öppna flöden (WordPress, kalenderfiler). Ingen nyckel behövs.
      - name: Musik i Uppland
        if: env.HAMTA == 'true'
        id: musikiuppland
        continue-on-error: true
        run: npm run hamta:musik-i-uppland

      - name: Katalin
        if: env.HAMTA == 'true'
        id: katalin
        continue-on-error: true
        run: npm run hamta:katalin

      - name: Uppsala Konsert & Kongress
        if: env.HAMTA == 'true'
        id: ukk
        continue-on-error: true
        run: npm run hamta:ukk

      - name: Uppsala Missionskyrka
        if: env.HAMTA == 'true'
        id: missionskyrkan
        continue-on-error: true
        run: npm run hamta:missionskyrkan

      - name: Bror Hjorths Hus
        if: env.HAMTA == 'true'
        id: brorhjorth
        continue-on-error: true
        run: npm run hamta:bror-hjorths-hus

      - name: Biotopia
        if: env.HAMTA == 'true'
        id: biotopia
        continue-on-error: true
        run: npm run hamta:biotopia

      - name: Fyrishov
        if: env.HAMTA == 'true'
        id: fyrishov
        continue-on-error: true
        run: npm run hamta:fyrishov

      - name: Billetto
        id: billetto
        # Hoppas över om hemligheten BILLETTO_API_KEY saknas.
        if: env.HAMTA == 'true' && env.BILLETTO_API_KEY != ''
        continue-on-error: true
        run: npm run hamta:billetto

      - name: Bygg kön för AI-klassningen (tmp/ko.json)
        id: ko
        continue-on-error: true
        run: node scripts/klassning/ko.mjs

      - name: Städa Claude-koden
        # Tar bort radbrytningar och mellanslag, som lätt följer med när koden
        # kopieras från ett smalt Terminal-fönster. Koden skrivs aldrig ut.
        if: env.HAR_CLAUDE == 'true'
        env:
          RA_KOD: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          ren=$(printf '%s' "$RA_KOD" | tr -d '[:space:]')
          echo "::add-mask::$ren"
          echo "CLAUDE_KOD=$ren" >> "$GITHUB_ENV"

      - name: Claude klassar det reglerna missade
        id: claude
        # Bara om hemligheten finns och kön inte är tom. Sidan fungerar fullt ut utan det här steget.
        if: env.HAR_CLAUDE == 'true' && steps.ko.outputs.antal != '' && steps.ko.outputs.antal != '0'
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_KOD }}
          github_token: ${{ github.token }} # så att Claudes GitHub-app inte behövs
          allowed_bots: "github-actions[bot]"
          prompt: "/klassa"
          claude_args: |
            --model ${{ env.KLASSA_MODELL }}
            --max-turns 20
            --allowedTools "Read(./tmp/ko.json),Write(./tmp/svar.json)"

      - name: Visa varför Claude-steget misslyckades
        # Bara felmeddelandet från Claude Code, aldrig källtexten.
        if: steps.claude.outcome == 'failure'
        continue-on-error: true
        run: |
          fil="$RUNNER_TEMP/claude-execution-output.json"
          if [ -f "$fil" ]; then
            svar=$(jq -r '.. | objects | select(.type? == "result") | (.result // .subtype // "okänt")' "$fil" | tail -1 | cut -c1-300)
            echo "Fel från Claude Code: ${svar:-inget felmeddelande}"
          else
            echo "Ingen utdatafil från Claude Code."
          fi

      - name: Kontrollera AI-svaren (data/etiketter.json)
        if: steps.claude.outcome == 'success'
        continue-on-error: true
        run: node scripts/klassning/validera.mjs

      - name: Bygg filen som sidan läser (data/sida.json)
        id: sida
        continue-on-error: true
        run: npm run bygg:sida

      - name: Mät kvaliteten (data/kvalitet.json)
        # Rapporterar bara. Stoppar aldrig publiceringen.
        continue-on-error: true
        run: npm run kvalitet

      - name: Spara källdatan krypterad till nästa körning
        id: packa
        if: always() && env.DATA_NYCKEL != ''
        continue-on-error: true
        run: |
          mkdir -p tmp
          node scripts/kalldata.mjs > tmp/kalldata.txt
          tar -czf - -T tmp/kalldata.txt | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:DATA_NYCKEL -out tmp/kalldata.enc
          echo "Sparade $(wc -l < tmp/kalldata.txt) filer krypterade."

      - name: Lägg källdatan i cachen
        if: always() && steps.packa.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: tmp/kalldata.enc
          key: kalldata-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Kryptera rådatan
        # Bilagor i ett öppet repo kan laddas ner av alla, så rådatan krypteras alltid.
        # Utan DATA_NYCKEL sparas ingen rådata alls.
        id: radata
        if: always() && env.DATA_NYCKEL != '' && hashFiles('data/radata/*.json') != ''
        continue-on-error: true
        run: tar -czf - data/radata | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:DATA_NYCKEL -out tmp/radata.enc

      - name: Spara den krypterade rådatan som bilaga till körningen
        if: always() && steps.radata.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: radata
          path: tmp/radata.enc
          retention-days: 14

      - name: Spara datafilerna i repot om de har ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/  # data/radata/ hoppas över tack vare .gitignore
          if git diff --cached --quiet; then
            echo "Inga ändringar."
          else
            git commit -m "Uppdatera evenemang"
            # Om något annat har sparats i main under körningen hämtar vi in det först.
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: Larm som ärenden (etiketten larm)
        # Skapar, kommenterar eller stänger ärenden. Stoppar aldrig publiceringen.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          UTFALL: >-
            {"Svenska kyrkan": "${{ steps.svk.outcome }}", "Uppsala stadsteater": "${{ steps.stadsteatern.outcome }}",
            "Destination Uppsala": "${{ steps.destination.outcome }}", "Tickster": "${{ steps.tickster.outcome }}",
            "Bibliotek Uppsala": "${{ steps.bibliotek.outcome }}",
            "Kubik Uppsala": "${{ steps.kubik.outcome }}", "Sport": "${{ steps.sport.outcome }}",
            "Ticketmaster": "${{ steps.ticketmaster.outcome }}", "Musik i Uppland": "${{ steps.musikiuppland.outcome }}",
            "Katalin": "${{ steps.katalin.outcome }}", "Uppsala Konsert & Kongress": "${{ steps.ukk.outcome }}",
            "Uppsala Missionskyrka": "${{ steps.missionskyrkan.outcome }}", "Bror Hjorths Hus": "${{ steps.brorhjorth.outcome }}",
            "Biotopia": "${{ steps.biotopia.outcome }}", "Fyrishov": "${{ steps.fyrishov.outcome }}", "Billetto": "${{ steps.billetto.outcome }}", "Sidans fil": "${{ steps.sida.outcome }}",
            "AI": "${{ steps.claude.outcome }}"}
        run: node scripts/kvalitet/larm.mjs

      - name: Kontrollera att alla källor gick bra
        run: |
          fel=0
          for kalla in "Svenska kyrkan:${{ steps.svk.outcome }}" "Uppsala stadsteater:${{ steps.stadsteatern.outcome }}" \
                       "Destination Uppsala:${{ steps.destination.outcome }}" \
                       "Tickster:${{ steps.tickster.outcome }}" \
                       "Bibliotek Uppsala:${{ steps.bibliotek.outcome }}" \
                       "Kubik Uppsala:${{ steps.kubik.outcome }}" \
                       "Sport:${{ steps.sport.outcome }}" \
                       "Ticketmaster:${{ steps.ticketmaster.outcome }}" \
                       "Musik i Uppland:${{ steps.musikiuppland.outcome }}" \
                       "Katalin:${{ steps.katalin.outcome }}" \
                       "Uppsala Konsert & Kongress:${{ steps.ukk.outcome }}" \
                       "Uppsala Missionskyrka:${{ steps.missionskyrkan.outcome }}" \
                       "Bror Hjorths Hus:${{ steps.brorhjorth.outcome }}" \
                       "Biotopia:${{ steps.biotopia.outcome }}" \
                       "Fyrishov:${{ steps.fyrishov.outcome }}" \
                       "Billetto:${{ steps.billetto.outcome }}" \
                       "Sidans fil:${{ steps.sida.outcome }}"; do
            namn="${kalla%%:*}"; utfall="${kalla#*:}"
            echo "$namn: ${utfall:-hoppades över}"
            if [ "$utfall" = "failure" ]; then fel=1; fi
          done
          exit $fel

# Hämtar Svenska kyrkans evenemang varje morgon och sparar dem i repot
# (data/svenska-kyrkan.json) och, om det är inställt, i Firestore.
#
# Går också att köra för hand: fliken Actions -> "Hämta Svenska kyrkan" -> Run workflow.

name: Hämta Svenska kyrkan

on:
  schedule:
    # Varje dag 04:13 UTC, alltså 06:13 svensk sommartid och 05:13 vintertid.
    - cron: "13 4 * * *"
  workflow_dispatch:

permissions:
  contents: write # behövs för att spara den nya datafilen i repot

concurrency:
  group: hamta-svenska-kyrkan
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera paket
        run: npm ci

      - name: Kör testerna
        run: npm test

      - name: Hämta från Svenska kyrkan
        env:
          SVK_API_KEY: ${{ secrets.SVK_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run hamta:svk

      - name: Spara rådatan som bilaga till körningen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radata-svenska-kyrkan
          path: data/radata/
          retention-days: 14
          if-no-files-found: ignore

      - name: Spara datafilen i repot om den har ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/svenska-kyrkan.json
          if git diff --cached --quiet; then
            echo "Inga ändringar."
          else
            git commit -m "Uppdatera evenemang från Svenska kyrkan"
            git push
          fi
